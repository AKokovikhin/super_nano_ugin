<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход - Nano Ugin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
        }
        .login-container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
        }
        .test-users {
            background: #f8f9fa;
            border-radius: 8px;
            border-left: 4px solid #007bff;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="login-container p-4">
                    <div class="text-center mb-4">
                        <h2 class="text-primary mb-2">
                            <i class="fas fa-network-wired"></i> Nano Ugin
                        </h2>
                        <p class="text-muted">Система учёта оборудования</p>
                    </div>

                    {% if form.errors %}
                    <div class="alert alert-danger alert-dismissible fade show" role="alert">
                        <strong>Ошибка!</strong> Неверное имя пользователя или пароль.
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                    {% endif %}

                    <form method="post">
                        {% csrf_token %}
                        
                        <div class="mb-3">
                            <label for="id_username" class="form-label">
                                <i class="fas fa-user"></i> Имя пользователя
                            </label>
                            <input type="text" name="username" class="form-control form-control-lg" 
                                   id="id_username" placeholder="Введите имя пользователя" required autofocus>
                        </div>
                        
                        <div class="mb-3">
                            <label for="id_password" class="form-label">
                                <i class="fas fa-lock"></i> Пароль
                            </label>
                            <input type="password" name="password" class="form-control form-control-lg" 
                                   id="id_password" placeholder="Введите пароль" required>
                        </div>
                        
                        <input type="hidden" name="next" value="{{ next }}">
                        
                        <button type="submit" class="btn btn-primary btn-lg w-100 mb-3">
                            <i class="fas fa-sign-in-alt"></i> Войти
                        </button>
                    </form>

                    <div class="test-users p-3 mt-4">
                        <h6 class="mb-3">
                            <i class="fas fa-users"></i> Тестовые пользователи:
                        </h6>
                        <div class="row">
                            <div class="col-6">
                                <small><strong>admin</strong></small><br>
                                <small class="text-muted">admin</small>
                            </div>
                            <div class="col-6 mt-2">
                                <small><strong>user</strong></small><br>
                                <small class="text-muted">user</small>
                            </div>

                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
